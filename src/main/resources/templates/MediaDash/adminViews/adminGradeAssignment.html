<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Grade Assignments</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/navStyle.css}"/>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 sidebar">
      <!-- Sidebar content goes here -->
      <ul class="nav flex-column">
        <li class ="nav-item">
          <h2 class="nav-header">Media Controller</h2>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminAssignment">Active Assignment</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminCources">Cources</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminSch">My Schedule</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminGrades">Grades</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminAccount">My Account</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminUpdateClass">Edit your Classes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminSignUpPage">Sign Up Here</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminAddStudent">Add a Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminSubmitAssignment">submit your assignment</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/adminGradeAssignment">grade assignment</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/LogOut">Log Out</a>
        </li>
      </ul>
    </div>
    
    <div class="col-md-9">
      <h1>Grade Assignments</h1>
      <br>
      <ul>
        <li th:each="file : ${files}">
          <a th:href="@{'/download/' + ${file}}" th:text="${file}">Download</a>
        </li>
      </ul>
      <br>
      <div class="col-md-9 CourceCardSection">
        <div class="container text-center">
          <div class="row align-items-start">
            <div th:each = "listAssignments: ${listAssignments}" class="col">
              <div class="card" style="width: 18rem;">
                <div class="card-body">
                  <h5 th:text = "${listAssignments.submissionName}" class="card-title"></h5>
                  <h6 th:text = "${listAssignments.assignmentName}" class="card-subtitle mb-2 text-body-secondary"></h6>
                  <p th:text = "${listAssignments.studentDescription}" class="card-text"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <br>
      <form th:action="@{/adminGradeAssignment}" th:object="${GradeForm}" method="post" class="form-create-activity-class">
        <div class="form-group">
          <label for="exampleFormControlSelect1">Select Submission</label>
          <select class="form-control" th:field="*{assignmentId}" id="exampleFormControlSelect1">
            <option value="">Select the Homework you want to grade</option>
            <option th:each="listAssignments : ${listAssignments}" th:value="${listAssignments.assignmentId}" th:text="${listAssignments.submissionName}"></option>
          </select>
        </div>
        <div class="form-group">
          <label for="exampleFormControlInput1">Enter a grade</label>
          <input type="text" class="form-control" th:field="*{Grade}" id="exampleFormControlInput1" placeholder="Enter Grade">
        </div>
        <div class="form-group">
          <label for="exampleFormControlInput1">Teacher Notes</label>
          <input type="text" class="form-control" th:field="*{teacherDescription}" id="exampleFormControlInput2" placeholder="Enter Feedback">
        </div>
        <button type="submit" class="btn btn-primary mb-2">Confirm Grades</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
