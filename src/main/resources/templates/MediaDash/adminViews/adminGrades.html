<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Navbar and Sidebar Example</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/navStyle.css}"/>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 sidebar">
            <!-- Sidebar content goes here -->
            <ul class="nav flex-column">
                <li class ="nav-item">
                    <h2 class="nav-header">Media Controller</h2>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAssignment">Active Assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminCources">Cources</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSch">My Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminGrades">Grades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAccount">My Account</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminUpdateClass">Edit your Classes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSignUpPage">Sign Up Here</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAddStudent">Add a Student</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSubmitAssignment">submit your assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminGradeAssignment">grade assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/LogOut">Log Out</a>
                </li>
            </ul>
        </div>
        <div class="col-md-9">
            <h1>Grades</h1>
                <div class="col-md-9 CourceCardSection">
                    <div class="container text-center">
                        <div class="row align-items-start">
                            <div th:each="gradeList: ${gradeList}" class="col">
                                <div class="card" style="width: 18rem;">
                                    <div class="card-body">
                                        <h5 th:text="${gradeList.submissionName}" class="card-title"></h5>
                                        <h6 th:text="${gradeList.Grade}" class="card-subtitle mb-2 text-body-secondary"></h6>
                                        <p th:text="${gradeList.teacherDescription}" class="card-text"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional, for dropdowns, toggles, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
