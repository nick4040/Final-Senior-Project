<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload File</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/navStyle.css}"/>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 sidebar">
            <!-- Sidebar content goes here -->
            <ul class="nav flex-column">
                <li class ="nav-item">
                    <h2 class="nav-header">Media Controller</h2>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAssignment">Active Assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminCources">Cources</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSch">My Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminGrades">Grades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAccount">My Account</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminUpdateClass">Edit your Classes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSignUpPage">Sign Up Here</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminAddStudent">Add a Student</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminSubmitAssignment">submit your assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/adminGradeAssignment">grade assignment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/LogOut">Log Out</a>
                </li>
            </ul>
        </div>
        <div class="col-md-9">
            <h1>Submit Assignments</h1>

            <br>

            <form method="post" enctype="multipart/form-data" th:object="${AddSubmissionForm}" th:action="@{/adminSubmitAssignment}">
            <input type="file" name="file" required>

                <div class="form-group">
                    <label for="exampleFormControlSelect1">Select Your Assignment</label>
                    <select class="form-control" th:field="*{assignmentId}" id="exampleFormControlSelect1">
                        <option value="">Select the Assignment you want to submit</option>
                        <option th:each="allAssignments : ${allAssignments}" th:value="${allAssignments.AssignmentID}" th:text="${allAssignments.assignmentName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="exampleFormControlTextarea7">Description</label>
                    <textarea class="form-control" th:field="*{studentDescription}" id="exampleFormControlTextarea7" rows="3"></textarea>
                </div>

                <button type="submit">submit</button>
            </form>

            <p th:text="${message}"></p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
